services:
  postgres:
    image: postgres:15-alpine
    container_name: cluster_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cluster_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    image: cluster-host-backend:latest
    container_name: cluster_backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - HOST_ENDPOINT=${HOST_ENDPOINT}
      - AGENT_ASSETS_DIR=/app/agent_assets
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
    volumes:
      - ./backend/agent_assets:/app/agent_assets
      - ./backend/static:/app/static
    ports:
      - "8082:8080"
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:

