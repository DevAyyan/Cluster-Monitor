services:
  postgres:
    image: postgres:15-alpine
    container_name: cluster_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cluster_monitor}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_123}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cluster_redis
    restart: unless-stopped
    ports:
      - "6381:6379"

  backend:
    build:
      context: ..
      dockerfile: cluster-host/backend/Dockerfile
    image: cluster-host-backend:latest
    container_name: cluster_backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - HOST_ENDPOINT=${HOST_ENDPOINT:-http://localhost:8082}
      - AGENT_ASSETS_DIR=/app/agent_assets
      - POSTGRES_DB=${POSTGRES_DB:-cluster_monitor}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_password_123}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Cluster Monitor Alerts}
      - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI:-}
      - PORT=5000
    volumes:
      - ./backend/agent_assets:/app/agent_assets
    ports:
      - "5050:5000"
    depends_on:
      - postgres
      - redis

  frontend:
    build: ./frontend
    image: cluster-frontend:latest
    container_name: cluster_frontend
    restart: unless-stopped
    ports:
      - "8082:8082"
    depends_on:
      - backend

volumes:
  postgres_data:

