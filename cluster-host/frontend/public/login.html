<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Cluster Monitor</title>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@600;700;800&display=swap"
        rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Main Style Reference -->
    <link rel="stylesheet" href="/static/css/app.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: var(--bg-darker);
            overflow: hidden;
            font-family: var(--font-inter);
        }

        .login-container {
            position: relative;
            z-index: 5;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            text-align: center;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-card:hover {
            box-shadow: 0 20px 40px rgba(56, 189, 248, 0.08), 0 0 2px var(--primary);
        }

        .logo-section {
            font-family: var(--font-outfit);
            font-weight: 800;
            font-size: 32px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .logo-section i {
            color: var(--primary);
            filter: drop-shadow(0 0 8px var(--primary));
        }

        .title-section {
            font-size: 15px;
            color: var(--text-secondary);
            margin-bottom: 40px;
            line-height: 1.5;
        }

        .btn-github {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 14px 20px;
            background-color: #24292e;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.15);
        }

        .btn-github:hover {
            background-color: #2b3137;
            transform: translateY(-2px);
            border-color: var(--primary);
            box-shadow: 0 6px 12px rgba(56, 189, 248, 0.15), 0 0 8px rgba(56, 189, 248, 0.3);
        }

        .btn-github:active {
            transform: translateY(0);
        }

        .btn-github i {
            font-size: 20px;
        }

        .footer-note {
            margin-top: 30px;
            font-size: 12px;
            color: var(--text-faint);
            line-height: 1.4;
        }

        .footer-note a {
            color: var(--text-secondary);
            text-decoration: none;
        }

        .footer-note a:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        /* Ambient glow spots */
        .glow-spot-1 {
            position: absolute;
            top: -20%;
            left: -20%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 1;
        }

        .glow-spot-2 {
            position: absolute;
            bottom: -20%;
            right: -20%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.04) 0%, transparent 70%);
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>

<body>
    <div class="glow-spot-1"></div>
    <div class="glow-spot-2"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <i class="fa-solid fa-chart-line"></i>
                <span>ClusterMonitor</span>
            </div>
            <div class="title-section">
                Real-time agentless & agent-based cluster analytics dashboard.
            </div>

            <a href="/api/auth/login" class="btn-github">
                <i class="fa-brands fa-github"></i>
                <span>Sign in with GitHub</span>
            </a>

            <div class="footer-note">
                <p style="margin-top:8px;">&copy; 2026 ClusterMonitor. All rights reserved.</p>
            </div>
        </div>
    </div>
</body>

</html>
